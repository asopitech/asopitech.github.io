site_name: Asopitech
site_url: https://asopitech.github.io/
site_description: Asopitech Landing Page
site_author: Asopitech

theme:
  name: material
  language: en
  custom_dir: overrides
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ja
          name: 日本語
          build: true
          nav_translations:
            Home: ホーム
            Nim Architecture Guide: Nim Architecture Guide
            Introduction: はじめに
            Overview: 概要
            Guide scope: このガイドの方針
            Design philosophy: 設計思想と安全性
            Tutorial: チュートリアル
            Setup and builds: セットアップとビルド
            Language basics and statements: 基本構文とステートメント
            Language architecture: 言語アーキテクチャ
            Backends and FFI: バックエンドとFFI
            Compilation and C interoperability: コンパイルとC相互運用
            JavaScript backend: JavaScriptバックエンド
            WebAssembly and MoonBit: WebAssemblyとMoonBit
            Type system and memory: 型システムとメモリ管理
            Type system and memory management: 型システムとメモリ管理
            Compile-time programming: コンパイル時プログラミング
            Expressiveness and metaprogramming: 表現力とメタプログラミング
            Runtime and tooling: ランタイムとツール
            Errors, concurrency, and NimScript: エラー処理・並行処理・NimScript
            Web development and runtimes: Web開発とランタイム
            JavaScript engines written in Nim: Nim製JavaScriptエンジン
            GUI development: GUI開発
            Numerical computing and AI: 数値計算・AI
            GPU computing and LLMs: GPU数値計算とLLM
            Comparisons: 他言語比較
            Comparison with C, Rust, and Zig: C・Rust・Zigとの比較
            Practice and adoption: 実践と採用判断
            Use cases, trade-offs, and adoption: 用途・弱点・採用判断
            Nim desktop projects: Nimデスクトッププロジェクト

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.mark
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Nim Architecture Guide:
      - Introduction:
          - Overview: nim/index.md
          - Guide scope: nim/guide-scope.md
          - Design philosophy: nim/design-and-safety.md
      - Tutorial:
          - Setup and builds: nim/getting-started.md
          - Language basics and statements: nim/language-basics.md
      - Language architecture:
          - Language architecture: nim/architecture.md
      - Backends and FFI:
          - Compilation and C interoperability: nim/compilation-and-ffi.md
          - JavaScript backend: nim/javascript-backend.md
          - WebAssembly and MoonBit: nim/wasm-and-moonbit.md
      - Type system and memory:
          - Type system and memory management: nim/types-and-memory.md
      - Compile-time programming:
          - Expressiveness and metaprogramming: nim/expressiveness-and-macros.md
      - Runtime and tooling:
          - Errors, concurrency, and NimScript: nim/runtime-and-tooling.md
      - Web development and runtimes:
          - JavaScript engines written in Nim: nim/javascript-engines.md
      - GUI development:
          - GUI development: nim/gui.md
      - Numerical computing and AI:
          - GPU computing and LLMs: nim/gpu-and-llm.md
      - Comparisons:
          - Comparison with C, Rust, and Zig: nim/comparisons.md
      - Practice and adoption:
          - Use cases, trade-offs, and adoption: nim/adoption.md
          - Nim desktop projects: nim/nim-projects.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/asopitech

copyright: Copyright &copy; 2024 Asopitech
